; ==============================================================================
; Touiteur.app - Configuration de la base de données
; ==============================================================================

; --- Option 1 : SQLite (Par défaut - Prêt à l'emploi en local sans configuration) ---
driver = sqlite
database = bd/touiteur.sqlite

; --- Option 2 : MySQL / MariaDB (Pour déploiement sur le serveur Webetu de l'IUT) ---
; Pour activer MySQL, commentez les deux lignes SQLite ci-dessus et décommentez ci-dessous :
; driver = mysql
; host = localhost
; database = touiteur_db
; username = votre_login
; password = votre_mot_de_passe
; charset = utf8mb4
